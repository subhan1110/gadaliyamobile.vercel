<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Square Base with smoothly rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#gmGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Smartphone Outer Body -->
  <g filter="url(#shadow)">
    <!-- Phone Chassis -->
    <rect x="136" y="66" width="240" height="380" rx="44" fill="#1E293B" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round" />

    <!-- Speaker Slit -->
    <line x1="228" y1="104" x2="284" y2="104" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

    <!-- Screen Display Area -->
    <rect x="156" y="132" width="200" height="248" rx="16" fill="#0F172A" />

    <!-- Stylized "G" Monogram for Gadaliya Mobile in Screen -->
    <path d="M 284 195 A 52 52 0 1 0 292 265 L 256 265 L 256 235 L 320 235 A 80 80 0 1 1 278 165 Z" fill="#60A5FA" />

    <!-- Home Bottom Indicator -->
    <line x1="226" y1="412" x2="286" y2="412" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
